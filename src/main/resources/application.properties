# ========================
# APPLICATION CONFIG
# ========================
spring.application.name=restaurant-management

# ========================
# DATABASE (H2 para dev / PostgreSQL para prod)
# ========================
spring.datasource.url=jdbc:h2:mem:restaurantdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ========================
# JWT CONFIG
# ========================
jwt.secret=c2VjcmV0S2V5UmVzdGF1cmFudE1hbmFnZW1lbnRTeXN0ZW0yMDI0UHJvZHVjdGlvblNlY3VyZUtleQ==
jwt.expiration=86400000

# ========================
# SERVER
# ========================
server.port=8080
